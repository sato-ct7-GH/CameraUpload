<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>答案・ワーク・アイデア 送信</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a9e7a;--green-dark:#0f7a5e;--green-light:#e6f7f3;
  --gray-bg:#f2f2f2;--gray-border:#ddd;--gray-text:#666;--radius:10px;
}
html,body{min-height:100%;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fafafa;color:#222;-webkit-font-smoothing:antialiased;}

#header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--gray-border);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.logo{width:32px;height:32px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
#header h1{font-size:16px;font-weight:600;flex:1}
#btn-gas-toggle{padding:5px 11px;background:transparent;border:1px solid var(--gray-border);border-radius:20px;font-size:12px;color:var(--gray-text);cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s;-webkit-tap-highlight-color:transparent;}
#btn-gas-toggle:hover{background:var(--gray-bg)}
#btn-gas-toggle.active{color:var(--green);border-color:var(--green)}

#gas-bar{background:#fffbea;border-bottom:1px solid #f0d070;padding:10px 16px;display:none;align-items:center;gap:8px;flex-wrap:wrap;}
#gas-bar.open{display:flex}
#gas-bar label{font-size:12px;font-weight:600;color:#7a5c00;white-space:nowrap}
#gas-url-input{flex:1;min-width:0;font-size:12px;padding:7px 10px;border:1px solid #e0c060;border-radius:6px;background:#fff;color:#333;}

main{max-width:520px;margin:0 auto;padding:18px 16px 40px;}
.section{margin-bottom:22px;}
.section-label{font-size:12px;font-weight:600;color:var(--gray-text);margin-bottom:8px;letter-spacing:.04em;}

/* クラスボタン（1行・均等幅） */
.class-grid{display:flex;flex-wrap:nowrap;gap:6px;}
.class-grid button{flex:1 1 0;min-width:0;border:1px solid var(--gray-border);background:#fff;color:#333;cursor:pointer;padding:12px 4px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.class-grid button:hover{border-color:var(--green);background:var(--green-light)}
.class-grid button.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* モード切替 */
.segment{display:flex;background:var(--gray-bg);border-radius:12px;padding:4px;gap:4px;}
.segment button{flex:1;border:none;background:transparent;cursor:pointer;padding:12px 8px;border-radius:9px;font-size:15px;font-weight:600;color:var(--gray-text);transition:all .15s;-webkit-tap-highlight-color:transparent;}
.segment button.active{background:var(--green);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dest-hint{margin-top:8px;font-size:12px;color:var(--green-dark);background:var(--green-light);border-radius:8px;padding:8px 11px;line-height:1.5;display:none;}

/* 氏名入力 */
input#name-text{width:100%;font-size:16px;padding:13px 12px;border:1px solid var(--gray-border);border-radius:var(--radius);background:#fff;color:#222;}
textarea#comment-text{width:100%;font-size:15px;padding:12px;border:1px solid var(--gray-border);border-radius:var(--radius);background:#fff;color:#222;font-family:inherit;resize:vertical;line-height:1.5;}
.required-empty{border-color:#d94f3d !important;background-color:#fdf0ee !important}

/* 撮影 */
.file-hidden{display:none}
.capture-row{display:flex;gap:8px;}
.cap-btn{flex:1;border:1px solid var(--gray-border);border-radius:var(--radius);background:#fff;color:var(--green-dark);cursor:pointer;padding:11px 8px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.cap-btn:hover{border-color:var(--green);background:var(--green-light)}
.cap-btn svg{width:18px;height:18px;stroke:var(--green);flex-shrink:0}
#preview-wrap{display:none;position:relative;border-radius:var(--radius);overflow:hidden;background:#000}
#preview-wrap.show{display:block}
#preview{width:100%;max-height:60vh;object-fit:contain;display:block}
#btn-retake{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;}

/* 送信 */
#btn-send{width:100%;border:none;border-radius:var(--radius);background:var(--green);color:#fff;font-size:17px;font-weight:700;padding:16px;cursor:pointer;transition:background .15s,opacity .15s;-webkit-tap-highlight-color:transparent;}
#btn-send:hover{background:var(--green-dark)}
#btn-send:disabled{opacity:.4;cursor:not-allowed}

#status{display:none;margin-top:16px;padding:12px 14px;font-size:14px;border-radius:var(--radius);align-items:center;gap:9px;line-height:1.5;}
#status.show{display:flex}
#status.info{background:#eef6ff;color:#1a5fa0}
#status.success{background:var(--green-light);color:var(--green-dark)}
#status.error{background:#fdf0ee;color:#d94f3d}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* リンク表示 */
#result{display:none;margin-top:14px;padding:14px;border:1px solid var(--green);border-radius:var(--radius);background:var(--green-light);}
#result.show{display:block}
#result .r-title{font-size:13px;font-weight:700;color:var(--green-dark);margin-bottom:8px}
#result a{display:block;font-size:13px;color:#0f5fae;word-break:break-all;margin-bottom:10px}
#result .r-actions{display:flex;gap:8px}
#result button{flex:1;border:1px solid var(--green);background:#fff;color:var(--green-dark);border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
#result button:hover{background:#fff}
</style>
</head>
<body>

<div id="header">
  <div class="logo">📷</div>
  <h1>答案・ワーク・アイデア 送信</h1>
  <button id="btn-gas-toggle" onclick="toggleGasBar()">⚙ 設定</button>
</div>

<div id="gas-bar">
  <label for="gas-url-input">GAS URL</label>
  <input id="gas-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec">
</div>

<main>
  <!-- クラス -->
  <div class="section">
    <div class="section-label">クラス</div>
    <div class="class-grid" id="class-seg">
      <button data-class="3-C"  onclick="selectClass('3-C')">3-C</button>
      <button data-class="3-DE" onclick="selectClass('3-DE')">3-DE</button>
      <button data-class="2-8"  onclick="selectClass('2-8')">2-8</button>
      <button data-class="2-9"  onclick="selectClass('2-9')">2-9</button>
      <button data-class="none" class="none" onclick="selectClass('none')">選択なし</button>
    </div>
  </div>

  <!-- 送信モード -->
  <div class="section">
    <div class="section-label">送信モード</div>
    <div class="segment" id="mode-seg">
      <button class="active" data-mode="shared"   onclick="setMode('shared')">共有</button>
      <button             data-mode="personal" onclick="setMode('personal')">個人</button>
    </div>
    <div class="dest-hint" id="dest-hint"></div>
  </div>

  <!-- 氏名 -->
  <div class="section">
    <div class="section-label">氏名</div>
    <input id="name-text" type="text" placeholder="氏名を入力（例：湘南太郎）" autocomplete="off">
  </div>

  <!-- 写真 -->
  <div class="section">
    <div class="section-label">写真</div>
    <input id="file-camera" class="file-hidden" type="file" accept="image/*" capture="environment" onchange="onFile(event)">
    <input id="file-pick"   class="file-hidden" type="file" accept="image/*" onchange="onFile(event)">
    <div class="capture-row" id="capture-row">
      <button class="cap-btn" id="btn-camera" onclick="document.getElementById('file-camera').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        撮影
      </button>
      <button class="cap-btn" id="btn-pick" onclick="document.getElementById('file-pick').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        選択
      </button>
    </div>
    <div id="preview-wrap">
      <img id="preview" alt="プレビュー">
      <button id="btn-retake" onclick="resetPhoto()">↺ 撮り直す</button>
    </div>
  </div>

  <!-- コメント（個人モードのみ） -->
  <div class="section" id="comment-section" style="display:none">
    <div class="section-label">コメント（任意）</div>
    <textarea id="comment-text" rows="3" placeholder="質問・コメントを入力"></textarea>
  </div>

  <!-- 送信 -->
  <div class="section">
    <button id="btn-send" onclick="send()">送信する</button>
    <div id="status"></div>
    <div id="result">
      <div class="r-title">✅ 送信完了 — あなたのフォルダ</div>
      <a id="result-link" href="#" target="_blank" rel="noopener"></a>
      <div class="r-actions">
        <button onclick="copyLink()">リンクをコピー</button>
        <button onclick="openLink()">フォルダを開く</button>
      </div>
    </div>
  </div>
</main>

<script>
// ===== 設定 =====
var STORAGE_KEY     = 'gas_upload_url';
var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbz7TfG8faY3joY7vkW8xvgpsTWPOZmiMWGun2CrOtbQQTveSAwSVhluEePm7EvcqMyPmg/exec';
var MAX_DIM = 1600, JPEG_Q = 0.9, MAX_RETRY = 3;

var selectedClass = null;   // null=未選択 / '3-C'.. / 'none'
var mode = 'shared';
var imageDataUrl = null;
var lastFolderUrl = '';

// ===== GAS URL =====
(function(){ document.getElementById('gas-url-input').value = localStorage.getItem(STORAGE_KEY) || DEFAULT_GAS_URL; })();
document.getElementById('gas-url-input').addEventListener('input', function(){ localStorage.setItem(STORAGE_KEY, this.value.trim()); });
function getGasUrl(){ return (document.getElementById('gas-url-input').value || DEFAULT_GAS_URL).trim(); }
function toggleGasBar(){
  var bar=document.getElementById('gas-bar'), btn=document.getElementById('btn-gas-toggle');
  var open=bar.classList.toggle('open'); btn.classList.toggle('active',open);
  if(open) document.getElementById('gas-url-input').focus();
}

// ===== クラス選択 =====
function selectClass(cls){
  selectedClass = cls;
  document.querySelectorAll('#class-seg button').forEach(function(b){ b.classList.toggle('active', b.dataset.class===cls); });
  updateHint();
}
function getName(){ return normalizeName(document.getElementById('name-text').value); }
function normalizeName(s){ return String(s || '').replace(/[\s\u3000]+/g, ''); }

// ===== モード =====
function setMode(m){
  mode=m;
  document.querySelectorAll('#mode-seg button').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===m); });
  document.getElementById('comment-section').style.display = (m==='personal') ? 'block' : 'none';
  updateHint();
}
function updateHint(){
  var hint=document.getElementById('dest-hint');
  if(selectedClass===null){ hint.style.display='none'; return; }
  hint.style.display='block';
  var name=getName();
  if(mode==='personal'){
    var label=(selectedClass==='none')?'':(selectedClass+' ');
    hint.innerHTML = name
      ? '送信先：'+label+'個人フォルダ「<b>'+esc(name)+'</b>」を作成／使用<br>送信後、フォルダのリンクが表示され、担当へ通知メールが届きます。'
      : '送信先：'+label+'個人フォルダ（氏名を入力してください）';
  } else {
    hint.innerHTML = '送信先：<b>共有フォルダ</b>' + (name ? '（ファイル名に「'+esc(name)+'」付与）' : '');
  }
}
document.getElementById('name-text').addEventListener('input', function(){ this.classList.remove('required-empty'); updateHint(); });

// ===== 写真選択 → 縮小 =====
function onFile(ev){
  var file=ev.target.files && ev.target.files[0];
  if(!file) return;
  setStatus('画像を処理中...', 'info');
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var scale=Math.min(MAX_DIM/img.width, MAX_DIM/img.height, 1);
      var w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      imageDataUrl=cv.toDataURL('image/jpeg', JPEG_Q);
      document.getElementById('preview').src=imageDataUrl;
      document.getElementById('preview-wrap').classList.add('show');
      document.getElementById('capture-row').style.display='none';
      clearStatus();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function resetPhoto(){
  imageDataUrl=null;
  document.getElementById('file-camera').value='';
  document.getElementById('file-pick').value='';
  document.getElementById('preview-wrap').classList.remove('show');
  document.getElementById('capture-row').style.display='flex';
  clearStatus();
}

// ===== 送信 =====
function send(){
  if(selectedClass===null){ setStatus('まずクラスを選んでください。','error'); return; }
  var name=getName();

  if(mode==='personal' && !name){
    document.getElementById('name-text').classList.add('required-empty');
    setStatus('個人モードでは氏名を入力してください。','error');
    return;
  }
  if(!imageDataUrl){ setStatus('先に写真を撮影／選択してください。','error'); return; }

  document.getElementById('result').classList.remove('show');
  var classId=(selectedClass==='none')?'':selectedClass;
  var comment=(mode==='personal') ? document.getElementById('comment-text').value.trim() : '';
  var fileName=(name? name+'_':'')+'photo_'+ts()+'.jpg';
  var body=JSON.stringify({ image:imageDataUrl, fileName:fileName, mode:mode, name:name, classId:classId, comment:comment });

  var btn=document.getElementById('btn-send'); btn.disabled=true;
  setStatus('送信中...', 'info');

  postWithRetry(getGasUrl(), body, 1)
    .then(function(data){
      if(!data || !data.success){
        setStatus('送信エラー：' + ((data && data.error) || '不明なエラー'), 'error');
        return;
      }
      lastFolderUrl = data.folderUrl || '';
      if(mode==='personal' && lastFolderUrl){
        showResult(data.folderName, lastFolderUrl);
        setStatus('送信しました。下のリンクがあなたのフォルダです。', 'success');
      } else {
        setStatus('送信しました（共有フォルダ）。続けて撮影できます。', 'success');
      }
      resetPhotoKeepForm();
    })
    .catch(function(){
      setStatus('送信に失敗しました。電波状況を確認してもう一度お試しください。', 'error');
    })
    .finally(function(){ btn.disabled=false; });
}

// text/plain の単純POST → レスポンス(JSON)を読み取る
function postWithRetry(url, body, attempt){
  return fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
    .then(function(r){ return r.json(); })
    .catch(function(err){
      if(attempt<MAX_RETRY){
        return new Promise(function(res){ setTimeout(res, 700*attempt); }).then(function(){ return postWithRetry(url, body, attempt+1); });
      }
      throw err;
    });
}

function showResult(folderName, url){
  var box=document.getElementById('result');
  var a=document.getElementById('result-link');
  a.href=url; a.textContent=(folderName? folderName+'：' : '') + url;
  box.classList.add('show');
}
function copyLink(){
  if(!lastFolderUrl) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastFolderUrl).then(function(){ setStatus('リンクをコピーしました。','success'); });
  } else {
    var t=document.createElement('textarea'); t.value=lastFolderUrl; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); setStatus('リンクをコピーしました。','success'); }catch(e){}
    document.body.removeChild(t);
  }
}
function openLink(){ if(lastFolderUrl) window.open(lastFolderUrl, '_blank', 'noopener'); }

function resetPhotoKeepForm(){
  imageDataUrl=null;
  document.getElementById('file-camera').value='';
  document.getElementById('file-pick').value='';
  document.getElementById('comment-text').value='';
  document.getElementById('preview-wrap').classList.remove('show');
  document.getElementById('capture-row').style.display='flex';
}

// ===== ユーティリティ =====
function ts(){ var d=new Date(), p=function(n){return ('0'+n).slice(-2);}; return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setStatus(msg,type){ var el=document.getElementById('status'); el.className='show '+type; el.innerHTML=(type==='info'?'<div class="spinner"></div>':'')+'<span>'+msg+'</span>'; }
function clearStatus(){ document.getElementById('status').className=''; }
</script>
</body>
</html>
